<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Tumble Home (test build)</title>
  <style>
    html, body { height: 100%; margin: 0; background: #14161f; color: #e9e6f5; font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; }
    #stage { position: fixed; inset: 0; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #14161f; touch-action: none; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; text-align: center; padding: 0 16px; }
    #loading strong { font-size: 1.6rem; }
    #loading p { margin: 0; color: #9a97ad; }
    #track { width: min(260px, 70%); height: 8px; background: #2a2d3c; border-radius: 4px; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #b9a2f2; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <strong>Tumble Home</strong>
      <div id="track"><div id="fill"></div></div>
      <p id="status">Loading the game (about 23 MB)</p>
    </div>
  </div>
  <script src="Build/WebGL.loader.js?v=11132340"></script>
  <script>
    (function () {
      var status = document.getElementById("status");
      if (typeof createUnityInstance !== "function") { status.textContent = "The game loader did not load. Reload the page to try again."; return; }
      createUnityInstance(document.getElementById("unity-canvas"), {
        dataUrl: "Build/WebGL.data?v=11132340",
        frameworkUrl: "Build/WebGL.framework.js?v=11132340",
        codeUrl: "Build/WebGL.wasm?v=11132340",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Tumble Home",
        productVersion: "1.0",
        showBanner: function (msg, type) { if (type === "error") { status.textContent = msg; document.getElementById("loading").style.display = "flex"; } }
      }, function (p) {
        document.getElementById("fill").style.width = Math.round(p * 100) + "%";
      }).then(function () {
        document.getElementById("loading").style.display = "none";
      }).catch(function (e) {
        status.textContent = "The game could not start: " + e;
      });
    })();
  </script>
</body>
</html>
